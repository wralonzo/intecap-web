name: CI/CD Deploy Frontend (intecap-web)

on:
  push:
    branches: [main, qa, develop]
    paths:
      - 'intecap-web/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: 'Selecciona el ambiente a desplegar'
        required: true
        default: 'prod'
        options:
          - 'develop'
          - 'qa'
          - 'prod'

jobs:
  # STAGE 1: Verificación de Dependencias y Compilación Angular
  build-check:
    name: 🔍 1. Verificar y Construir Angular (Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Instalar Dependencias
        run: npm install --legacy-peer-deps

      - name: Verificar Compilación Angular (Producción)
        run: npm run build --configuration=production

  # STAGE 2: Despliegue en VPS (Manual vía workflow_dispatch o Push a main)
  deploy-vps:
    name: 🚀 2. Desplegar Frontend en VPS
    needs: build-check
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    environment: INTECAP
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar Frontend en VPS vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            TARGET_ENV="${{ inputs.environment || 'prod' }}"
            BRANCH="${{ github.ref_name }}"
            echo "🎛️ Despliegue de Frontend INTECAP activado para el ambiente: $TARGET_ENV (Rama: $BRANCH)"
            echo "🌐 Dominio: intecap.appgtmobile.online | Servicio: intecap-web"

            # 1. Navegar a la carpeta del proyecto en el servidor VPS
            if [ -d "/home/intecap/intecap-web" ]; then
              cd /home/intecap/intecap-web
            elif [ -d "/var/www/intecap/intecap-web" ]; then
              cd /var/www/intecap/intecap-web
            elif [ -d "/home/intecap" ]; then
              cd /home/intecap/intecap-web
            else
              cd /root/intecap/intecap-web || cd /home/intecap
            fi

            # 2. Actualizar cambios del repositorio con el token de despliegue
            git fetch https://x-access-token:${{ secrets.TOKEN_DEPLOY }}@github.com/${{ github.repository }}.git $BRANCH
            git reset --hard FETCH_HEAD

            # 3. Asegurar que la red externa de Traefik exista
            docker network inspect proxy-net >/dev/null 2>&1 || docker network create proxy-net

            # 4. Reconstruir y levantar el contenedor del frontend Angular con Docker Compose
            docker compose up -d --build --no-deps intecap-web

            # 5. Limpieza de imágenes dangling/huérfanas
            docker image prune -f

            echo "✅ ¡Frontend intecap-web desplegado exitosamente en https://intecap.appgtmobile.online!"
